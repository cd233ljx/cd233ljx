<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160" role="img" aria-labelledby="title desc">
  <title id="title">UtoPiaCD</title>
  <desc id="desc">A warm, quiet header with a gently orbiting dot and small stars.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#181a1e"/>
      <stop offset="1" stop-color="#29211f"/>
    </linearGradient>
  </defs>
  <style>
    .orbit { transform-origin: 766px 80px; animation: orbit 38s linear infinite; }
    .star { animation: breathe 7s ease-in-out infinite; }
    .star-late { animation: breathe 7s ease-in-out -3s infinite; }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes breathe { 0%, 100% { opacity: .35; } 50% { opacity: .8; } }
    @media (prefers-reduced-motion: reduce) {
      .orbit, .star, .star-late { animation: none; }
    }
  </style>
  <rect width="900" height="160" rx="12" fill="url(#wash)"/>
  <text x="32" y="96" fill="#eee5dc" font-family="Georgia, Cambria, 'Times New Roman', serif" font-size="64" font-weight="400" letter-spacing="-2">UtoPiaCD</text>
  <path d="M34 123h68" fill="none" stroke="#d29b7f" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M112 123h186" fill="none" stroke="#51453e" stroke-linecap="round"/>
  <circle cx="308" cy="123" r="2" fill="#d29b7f" opacity=".6"/>
  <g fill="none" stroke="#d29b7f" stroke-width=".8">
    <circle cx="766" cy="80" r="65" opacity=".36"/>
    <ellipse cx="766" cy="80" rx="112" ry="42" transform="rotate(-24 766 80)" opacity=".27"/>
    <circle cx="766" cy="80" r="100" stroke-dasharray="2 8" opacity=".17"/>
  </g>
  <g class="orbit">
    <circle cx="831" cy="80" r="3.5" fill="#d29b7f"/>
    <circle cx="831" cy="80" r="7" fill="#d29b7f" opacity=".12"/>
  </g>
  <g stroke="#d29b7f" fill="none" stroke-width="1" stroke-linejoin="round">
    <path d="M766 64l4 12 12 4-12 4-4 12-4-12-12-4 12-4z" opacity=".75"/>
    <path class="star" d="M660 42l2.5 7.5L670 52l-7.5 2.5L660 62l-2.5-7.5L650 52l7.5-2.5z"/>
    <path class="star-late" d="M859 104l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>
  </g>
  <circle cx="686" cy="119" r="1.5" fill="#d29b7f" opacity=".4"/>
  <circle cx="855" cy="36" r="1.5" fill="#d29b7f" opacity=".4"/>
</svg>
